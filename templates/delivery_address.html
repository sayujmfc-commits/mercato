{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Delivery Address - MERCATO</title>

    <link rel="stylesheet"
          href="{% static 'assets/css/bootstrap.min.css' %}">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="text-success text-center mb-4">
                    Delivery Details
                </h2>

                <h5 class="mb-4">
                    Product: {{ product.name }}
                </h5>

                <h5 class="mb-4">
                    Price: ₹{{ product.price }}
                </h5>


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               name="customer_name"
                               class="form-control"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Delivery Address
                        </label>

                        <textarea name="address"
                                  class="form-control"
                                  rows="4"
                                  required></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input type="text"
                               name="city"
                               class="form-control"
                               required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Pincode
                        </label>

                        <input type="text"
                               name="pincode"
                               class="form-control"
                               required>

                    </div>


                    <h4 class="mb-3">
                        Payment Method
                    </h4>


                    <!-- Cash on Delivery -->

                    <div class="form-check mb-2">

                        <input class="form-check-input"
                               type="radio"
                               name="payment_method"
                               value="Cash on Delivery"
                               required>

                        <label class="form-check-label">
                            Cash on Delivery
                        </label>

                    </div>


                    <!-- Online Payment -->

                    <div class="form-check mb-4">

                        <input class="form-check-input"
                               type="radio"
                               name="payment_method"
                               value="Online Payment"
                               onclick="showPaymentMessage()">

                        <label class="form-check-label">
                            Online Payment
                        </label>

                    </div>


                    <button type="submit"
                            class="btn btn-success w-100">

                        Continue & Place Order

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- ================================= -->
<!-- Online Payment Unavailable Popup -->
<!-- ================================= -->

<div id="paymentPopup" style="
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    max-width: 90%;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
    z-index: 99999;
">

    <!-- Lock Icon -->

    <div style="
        font-size: 45px;
        margin-bottom: 10px;
    ">
        🔒
    </div>


    <h2 style="
        color: #198754;
        margin-bottom: 15px;
        font-weight: bold;
    ">
        Online Payment
    </h2>


    <p style="
        color: #333;
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 25px;
    ">

        Online payment is currently unavailable.

        <br>

        Please select
        <b>Cash on Delivery</b>.

    </p>


    <button onclick="closePaymentMessage()"
            class="btn btn-success"
            style="
                padding: 10px 35px;
                border-radius: 8px;
            ">

        OK

    </button>

</div>


<!-- ====================== -->
<!-- Popup Background -->
<!-- ====================== -->

<div id="paymentOverlay"
     onclick="closePaymentMessage()"
     style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 99998;
">
</div>


<!-- ====================== -->
<!-- Popup JavaScript -->
<!-- ====================== -->

<script>

function showPaymentMessage() {

    // Unselect Online Payment

    document.querySelector(
        'input[value="Online Payment"]'
    ).checked = false;


    // Show popup

    document.getElementById("paymentPopup").style.display = "block";

    document.getElementById("paymentOverlay").style.display = "block";

}


function closePaymentMessage() {

    // Close popup

    document.getElementById("paymentPopup").style.display = "none";

    document.getElementById("paymentOverlay").style.display = "none";

}

</script>


</body>

</html>
