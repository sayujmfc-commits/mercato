<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

/* Background */
body {
  height: 100vh;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Card */
.signup-card {
  width: 100%;
  max-width: 850px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  color: white;
  position: relative; /* 👈 IMPORTANT */
}
/* Title */
.signup-card h2 {
  text-align: center;
  margin-bottom: 25px;
}

/* Grid */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

/* Form group */
.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: span 2;
}

/* Inputs */
input {
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-top: 5px;
  outline: none;
  background: rgba(255,255,255,0.9);
}

/* Focus effect */
input:focus {
  box-shadow: 0 0 8px rgba(255,255,255,0.8);
}

/* Button */
.signup-btn {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #43e97b, #38f9d7);
  color: #000;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.signup-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* Image preview */
.preview {
  margin-top: 10px;
  max-width: 100px;
  border-radius: 10px;
  display: none;
}
/* Close Button */
.close-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 28px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

.close-btn:hover {
  color: #ff4d4d;
  transform: scale(1.2);
}

/* Responsive */
@media (max-width: 768px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="signup-card">
  <a href="{% url 'index' %}" class="close-btn">&times;</a>
  <h2>LOGIN</h2>

  <form method="POST" action="login" >
    {% csrf_token %}

    <div class="form-grid">

     

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="useremail" placeholder="Enter your email" required>
      </div>

  

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="userpassword" placeholder="Enter password" required>
      </div>

    </div>

    <button class="signup-btn" type="submit">Login</button>
  </form>
</div>

<script>
/* Image Preview */
const input = document.getElementById("photoInput");
const preview = document.getElementById("preview");

input.addEventListener("change", function() {
  const file = this.files[0];
  if (file) {
    preview.style.display = "block";
    preview.src = URL.createObjectURL(file);
  }
});
</script>

</body>
</html>
