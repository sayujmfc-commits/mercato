<!DOCTYPE html>
<html>
<head>
    <title>Shop Products</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f1f3f6;
            margin: 0;
        }

        .header {
            background: #2874f0;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            position: relative;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-name {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0 5px;
        }

        .price {
            color: #388e3c;
            font-size: 18px;
            font-weight: bold;
        }

        .stock {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #388e3c;
        }

        .out {
            color: red;
            font-weight: bold;
            margin-top: 8px;
        }

        .btn {
            margin-top: 10px;
            display: block;
            width: 100%;
            padding: 10px;
            background: #ff9f00;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn:hover {
            background: #fb8c00;
        }

        .disabled-btn {
            margin-top: 10px;
            display: block;
            width: 100%;
            padding: 10px;
            background: #999;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
            cursor: not-allowed;
        }

        /* Back Button */

        .back-btn {
            position: absolute;
            top: 12px;
            left: 15px;
            padding: 6px 12px;
            background: white;
            color: #2874f0;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2874f0;
            color: white;
        }

    </style>
</head>

<body>

<div class="header">

    <a href="{% url 'index' %}" class="back-btn">
        ⬅
    </a>

    🛒 My Shop

</div>


<div class="container">

    <div class="grid">

        {% for product in products %}

        <div class="card">

            <img src="{{ product.image.url }}"
                 class="product-img">


            <div class="product-name">
                {{ product.name }}
            </div>


            <div>
                <span class="price">
                    ₹{{ product.price }}
                </span>
            </div>


            <!-- Stock Quantity -->

            {% if product.quantity > 0 %}

                <div class="stock">
                    Stock Available: {{ product.quantity }}
                </div>

                <a href="{% url 'buy_product' product.id %}"
                   class="btn">

                    Buy Now

                </a>

            {% else %}

                <div class="out">
                    OUT OF STOCK
                </div>

                <div class="disabled-btn">
                    Buy Now
                </div>

            {% endif %}


        </div>

        {% empty %}

            <p>No products available</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
