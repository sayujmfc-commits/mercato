<!DOCTYPE html>
<html>
<head>
    <title>Order Placed</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f1f3f6;
            margin: 0;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .success {
            font-size: 50px;
            color: green;
        }

        h2 {
            margin: 10px 0;
            color: #333;
        }

        .product-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin: 15px 0;
        }

        .details {
            text-align: left;
            margin-top: 15px;
        }

        .details p {
            margin: 5px 0;
            font-size: 14px;
        }

        .price {
            color: #388e3c;
            font-weight: bold;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 15px;
            background: #2874f0;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="success">✅</div>

    <h2>Order Placed Successfully!</h2>
    <p>Your item will be delivered soon 🚚</p>

    <img src="{{ product.image.url }}" class="product-img">

    <div class="details">
        <p><strong>Product:</strong> {{ product.name }}</p>
        <p><strong>Brand:</strong> {{ product.brand }}</p>
        <p><strong>Price:</strong> <span class="price">₹{{ product.price }}</span></p>
        <p><strong>Description:</strong> {{ product.description }}</p>
    </div>

    <a href="{% url 'product_list' %}" class="btn">Continue Shopping</a>

</div>

</body>
</html>
