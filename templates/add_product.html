<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
    width: 500px;
    margin: 50px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    position: relative; /* 👈 ADD THIS */
}

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            display: block;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
        }

        button:hover {
            background: #218838;
        }
        .back-btn {
    position: absolute;
    top: 15px;
    left: 15px;
    background: #f1f1f1;
    color: #333;
    text-decoration: none;
    font-size: 18px;
    padding: 6px 10px;
    border-radius: 50%;
    transition: 0.3s;
}

.back-btn:hover {
    background: #28a745;
    color: white;
}
    </style>
</head>
<body>

<div class="container">
    <a href="{% url 'index' %}" class="back-btn">⬅</a>

    <h2>Add Product</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name">
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category">
        </div>

        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" name="price">
        </div>

        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" name="quantity" min="0" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description"></textarea>
        </div>

        <div class="form-group">
            <label>Product Image</label>
            <input type="file" name="image">
        </div>

        <div class="form-group">
            <label>Brand</label>
            <input type="text" name="brand">
        </div>

        <div class="form-group">
            <label>Discount (%)</label>
            <input type="number" name="discount">
        </div>

        <div class="form-group">
            <label>Available</label>
            <input type="checkbox" name="is_available">
        </div>

        <button type="submit">Add Product</button>
    </form>

</div>

</body>
</html>
